	<body>

			<textarea id="text" name="text" rows="4" cols="30"></textarea>

		<fieldset>
			<legend>Fancify</legend>
			<input type="button" id="biggerButton" value="Bigger!" onclick="sayHello(); increaseFontSize();" />

			<input type="radio" name="fancyOrBoring" id="boringBetty" value="boring" onchange="boringAlert(); radioEvent();" />

		</fieldset>
